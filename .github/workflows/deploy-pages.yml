name: Deploy Arirang Exhibition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:github
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Fix public asset paths for project Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.txt' \) -print0 | xargs -0 sed -i \
            -e "s#'/audio/#'/${REPO_NAME}/audio/#g" \
            -e "s#\"/audio/#\"/${REPO_NAME}/audio/#g" \
            -e "s#'/images/#'/${REPO_NAME}/images/#g" \
            -e "s#\"/images/#\"/${REPO_NAME}/images/#g"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

